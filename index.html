<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
          || (window.innerWidth > 0 && window.innerWidth <= 768);
        if (isMobile) {
          var viewport = document.querySelector("meta[name=viewport]");
          if (viewport) {
            var screenWidth = window.screen.width || window.innerWidth || 360;
            var initialScale = screenWidth / 1280;
            viewport.setAttribute('content', 'width=1280, initial-scale=' + initialScale.toFixed(3) + ', minimum-scale=' + (initialScale * 0.5).toFixed(3) + ', maximum-scale=3.0, user-scalable=yes');
          }
        }
      })();
    </script>
    <title>dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
